# Single-node cluster for tests/e2e/run.sh. Kubernetes 1.36: image volumes are GA.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    kubeadmConfigPatches:
      # The kubelet can't stat ZFS-backed docker roots ("cannot find filesystem info for
      # device zroot/var/lib/docker") unless local storage capacity isolation is off.
      # Harmless elsewhere.
      - |
        kind: KubeletConfiguration
        localStorageCapacityIsolation: false
