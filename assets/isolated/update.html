{% extends "admin/challenges/update.html" %}

{# hide connection info block #}
{% block connection_info %}
{% endblock %}

{% block value %}
<div class="form-group">
	<label for="value">Destroy on flag<br>
		<small class="form-text text-muted">
			<span>If enabled, the instance will be destroyed when the player flags the challenge.
				It is disabled by default.</span>
		</small>
	</label>
	<select id="select-dof" class="custom-select" name="destroy_on_flag">
		<option value=true {% if challenge.destroy_on_flag %}selected{% endif %} >Enabled</option>
		<option value=false  {% if not challenge.destroy_on_flag %}selected{% endif %} >Disabled</option>
	</select>
</div>

<div id="current-yaml-id" style="display: none;">{{ challenge.yaml_id }}</div>

<div class="form-text">
	<table class="tg">
		<thead>
		  <tr>
			<td class="tg-0lax">
				<div><b>Current YAML spec: </b></div>
			</td>
			<td class="tg-0pky">
				<div id="yaml_file"></div>
			</td>			
		  </tr>
		</thead>
		</table>
</div>

<div class="form-group">
	<label for="value">YAML challenge spec<br>
		<small class="form-text text-muted">
			This is the YAML file containing the challenge definition
		</small>
	</label>
	<input type="file" class="form-control" id="yaml" data-test-id="yaml-create-id" name="yaml" accept=".yaml">
	<input type="hidden" id="yaml_id" class="form-control" name="yaml_id">
</div>

{{ super() }}
{% endblock %}
