{% extends "admin/challenges/create.html" %}

{% block header %}
<div class="alert alert-secondary" role="alert">
	Isolated challenges are hosted using prism-ctf, each player can spawn a dedicated instance on-demand.
	Flags are generated per-player.
</div>
{% endblock %}

{% block value %}
<div class="form-group">
	<label for="value">Destroy on flag<br>
		<small class="form-text text-muted">
			<span>If enabled, the instance will be destroyed when the player flags the challenge.
				It is disabled by default.</span>
		</small>
	</label>
	<select id="select-dof" class="custom-select" name="destroy_on_flag">
		<option value=true>Enabled</option>
		<option value=false selected>Disabled</option>
	</select>
</div>

<div class="form-group">
	<label for="value">YAML challenge spec<br>
		<small class="form-text text-muted">
			This is the YAML file containing the challenge definition
		</small>
	</label>
	<input type="file" class="form-control" id="yaml" name="scenario" accept=".yaml" required>
	<input type="hidden" id="yaml_id" class="form-control" name="yaml_id">
</div>

{{ super() }}
{% endblock %}

{% block type %}
<input type="hidden" value="prism_isolated" name="type" id="chaltype">
{% endblock %}
